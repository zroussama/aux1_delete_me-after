<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Yellow/Gold Border Triangle -->
  <polygon points="256,24 482,424 30,424" fill="#FFD700" />
  
  <!-- Inner Black Border Triangle -->
  <polygon points="256,36 470,418 42,418" fill="#000000" />

  <!-- Main Red Triangle -->
  <polygon points="256,48 458,410 54,410" fill="#D3080C" />

  <!-- Target White Circle Ring -->
  <circle cx="256" cy="270" r="62" fill="none" stroke="#FFFFFF" stroke-width="20" />

  <!-- Yellow Lightning Bolt -->
  <polygon points="276,75 190,245 330,215 220,395 255,235 192,245" fill="#FFE600" stroke="#FFC700" stroke-width="2" stroke-linejoin="round" />

  <!-- TN Label -->
  <text x="256" y="492" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-weight="900" font-size="40" fill="#FFE600" letter-spacing="2">TN</text>
</svg>
